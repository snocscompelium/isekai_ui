name: Compilar e testar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # O Gradle/Loom roda no Java 25; o mod continua sendo compilado para Java 21 (options.release = 21)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o mod
        id: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Assinaturas da API do Minecraft (referencia)
        if: always()
        run: bash ci/dump-api.sh > javap.txt 2>&1 || true

      - name: Preparar tela virtual
        if: steps.build.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      - name: Teste no jogo (prints da interface)
        id: gametest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace 2>&1 | tee gametest.log

      - name: Juntar resultados
        if: always()
        run: |
          mkdir -p out/screenshots out/logs
          cp build.log out/ 2>/dev/null || true
          cp gametest.log out/ 2>/dev/null || true
          cp javap.txt out/ 2>/dev/null || true
          find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" -exec cp {} out/ \; 2>/dev/null || true
          find . -path ./out -prune -o -name "*isekai-*.png" -print 2>/dev/null | while read -r f; do cp "$f" out/screenshots/; done
          find build/run -name "latest.log" -exec cp {} out/logs/ \; 2>/dev/null || true
          find build/run -path "*crash-reports*" -name "*.txt" -exec cp {} out/logs/ \; 2>/dev/null || true
          echo "commit=${{ github.sha }}" > out/status.txt
          echo "build=${{ steps.build.outcome }}" >> out/status.txt
          echo "gametest=${{ steps.gametest.outcome }}" >> out/status.txt
          ls -la out out/screenshots out/logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isekai-ui
          path: out/

      - name: Publicar resultados no branch ci-output
        if: always()
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b ci-output
          git add -A
          git commit -q -m "Resultado do CI para ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output

      - name: Atualizar a versao de teste (Releases)
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" | head -1)
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --title "Versao de teste" --notes "Gerada automaticamente a cada atualizacao do codigo. Baixe o .jar e coloque na pasta mods (Fabric + Fabric API)."
          gh release upload dev "$JAR" --clobber
